<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assisto – Mein Konto</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="theme-color" content="#060606">
    <link rel="stylesheet" href="/assets/app.css">
    <style>
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            max-width: 380px;
        }

        .card h2 {
            font-size: 15px;
            margin: 0 0 4px 0;
        }

        .card p.sub {
            color: var(--soft);
            font-size: 12px;
            margin: 0 0 14px 0;
        }

        button.primary {
            width: 100%;
        }

        .case-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            max-width: 480px;
        }

        .case-meta { font-size: 11px; color: var(--soft); margin-bottom: 6px; }
        .case-fp { font-size: 11px; color: var(--soft); margin-bottom: 8px; word-break: break-all; }
        .case-actions { display: flex; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app-shell">

        <div class="mobile-topbar">
            <button type="button" class="hamburger-btn" id="hamburger-btn">☰</button>
            <span class="topbar-brand">Assisto</span>
        </div>

        <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">Assisto</div>
            <div class="sidebar-identity" id="app-identity"></div>
            <nav class="sidebar-nav" id="app-nav"></nav>
        </div>

        <div class="app-main">
            <div id="logged-out-notice" class="card" hidden>
                <p class="sub" style="margin-bottom:0;">Bitte zuerst <a href="/login.html?redirect=/account.html">anmelden</a>.</p>
            </div>

            <div id="account-content" hidden>
                <h1>Mein Konto</h1>

                <div class="card">
                    <h2>Passwort ändern</h2>
                    <p class="sub">Mindestens 8 Zeichen.</p>
                    <form id="pw-form">
                        <label>Neues Passwort</label>
                        <input type="password" id="new-password" autocomplete="new-password" />
                        <label>Neues Passwort bestätigen</label>
                        <input type="password" id="new-password-confirm" autocomplete="new-password" />
                        <button type="submit" class="primary" id="pw-submit">Speichern</button>
                        <div class="message" id="pw-message"></div>
                    </form>
                </div>

                <div class="card" style="max-width:480px;">
                    <h2>Meine gemeldeten Fälle</h2>
                    <p class="sub">Bearbeite oder lösche Cause/Remedy, die du selbst eingetragen hast.</p>
                    <div id="my-cases-list"><div class="loading">Lade…</div></div>
                </div>
            </div>
        </div>

    </div>

    <script src="/assets/auth-client.js"></script>
    <script src="/assets/sidebar.js"></script>
    <script src="/assets/photo-upload.js"></script>
    <script src="/assets/pwa.js"></script>
    <script>
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    var auth = AssistoAuth.get();

    if (!auth || !auth.token) {
        document.getElementById('logged-out-notice').hidden = false;
    } else {
        document.getElementById('account-content').hidden = false;
        loadMyCases();
    }

    function loadMyCases() {
        fetch('/api/case?mine=1', { headers: AssistoAuth.headers() })
            .then(function(resp) {
                if (resp.status === 401) {
                    AssistoAuth.clear();
                    throw new Error('Sitzung abgelaufen — bitte erneut anmelden.');
                }
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                return resp.json();
            })
            .then(function(data) { renderMyCases(data.cases || []); })
            .catch(function(err) {
                document.getElementById('my-cases-list').innerHTML =
                    '<div class="empty-state">Konnte Fälle nicht laden: ' + escapeHtml(err.message) + '</div>';
            });
    }

    function renderMyCases(cases) {
        var el = document.getElementById('my-cases-list');
        if (cases.length === 0) {
            el.innerHTML = '<div class="empty-state">Du hast noch keine Fälle gemeldet.</div>';
            return;
        }
        el.innerHTML = cases.map(function(c) {
            return '<div class="case-card" data-id="' + escapeHtml(c.id) + '">' +
                '<div class="case-meta">' + escapeHtml(new Date(c.timestamp).toLocaleString()) +
                    (c.machineType ? ' &middot; ' + escapeHtml(c.machineType) : '') +
                '</div>' +
                '<div class="case-fp">' + escapeHtml(c.fingerprint) + '</div>' +
                '<label>Cause</label>' +
                '<textarea rows="2" class="edit-cause">' + escapeHtml(c.cause) + '</textarea>' +
                '<label>Remedy</label>' +
                '<textarea rows="2" class="edit-remedy">' + escapeHtml(c.remedy) + '</textarea>' +
                '<div class="photo-thumbs" data-photos-for="' + escapeHtml(c.id) + '"></div>' +
                '<div style="margin-top:8px;">' +
                    '<label>Foto hinzufügen</label>' +
                    '<input type="file" class="photo-input" accept="image/*" capture="environment" />' +
                '</div>' +
                '<div class="case-actions">' +
                    '<button type="button" class="primary save-btn">Speichern</button>' +
                    '<button type="button" class="danger delete-btn">Löschen</button>' +
                '</div>' +
                '<div class="message"></div>' +
            '</div>';
        }).join('');

        el.querySelectorAll('.case-card').forEach(function(card) {
            var id = card.getAttribute('data-id');
            var msgEl = card.querySelector('.message');
            var photosEl = card.querySelector('.photo-thumbs');

            function loadPhotos() {
                fetch('/api/case-photo?caseId=' + encodeURIComponent(id))
                    .then(function(resp) { return resp.json(); })
                    .then(function(data) {
                        var photos = data.photos || [];
                        photosEl.innerHTML = photos.map(function(p) {
                            return '<span class="photo-thumb" data-photo-id="' + escapeHtml(p.id) + '">' +
                                '<img src="/api/case-photo?id=' + encodeURIComponent(p.id) + '" alt="Foto" loading="lazy" />' +
                                '<button type="button" class="photo-remove" title="Foto löschen">&times;</button>' +
                            '</span>';
                        }).join('');
                        photosEl.querySelectorAll('.photo-remove').forEach(function(btn) {
                            btn.addEventListener('click', function() {
                                var photoId = btn.parentElement.getAttribute('data-photo-id');
                                fetch('/api/case-photo?id=' + encodeURIComponent(photoId), {
                                    method: 'DELETE',
                                    headers: AssistoAuth.headers()
                                })
                                    .then(function(resp) { return resp.json().then(function(b) { return { ok: resp.ok, body: b }; }); })
                                    .then(function(r) {
                                        if (!r.ok || !r.body.success) throw new Error(r.body.message || 'Löschen fehlgeschlagen');
                                        loadPhotos();
                                    })
                                    .catch(function(err) { alert(err.message); });
                            });
                        });
                    })
                    .catch(function() { /* thumbnails are a nice-to-have, fail silently */ });
            }
            loadPhotos();

            card.querySelector('.photo-input').addEventListener('change', function() {
                var file = this.files && this.files[0];
                if (!file) return;
                var input = this;
                input.disabled = true;
                compressPhotoToBase64(file)
                    .then(function(photo) {
                        return fetch('/api/case-photo', {
                            method: 'POST',
                            headers: AssistoAuth.headers({ 'Content-Type': 'application/json' }),
                            body: JSON.stringify({ caseId: id, contentType: photo.contentType, dataBase64: photo.dataBase64 })
                        });
                    })
                    .then(function(resp) { return resp.json().then(function(b) { return { ok: resp.ok, body: b }; }); })
                    .then(function(r) {
                        if (!r.ok || !r.body.success) throw new Error(r.body.message || 'Hochladen fehlgeschlagen');
                        loadPhotos();
                    })
                    .catch(function(err) { alert(err.message); })
                    .then(function() {
                        input.disabled = false;
                        input.value = '';
                    });
            });

            card.querySelector('.save-btn').addEventListener('click', function() {
                var cause = card.querySelector('.edit-cause').value.trim();
                var remedy = card.querySelector('.edit-remedy').value.trim();
                fetch('/api/case', {
                    method: 'PUT',
                    headers: AssistoAuth.headers({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ id: id, cause: cause, remedy: remedy })
                })
                    .then(function(resp) { return resp.json().then(function(b) { return { ok: resp.ok, body: b }; }); })
                    .then(function(r) {
                        if (!r.ok || !r.body.success) throw new Error(r.body.message || 'Speichern fehlgeschlagen');
                        msgEl.textContent = 'Gespeichert.';
                        msgEl.className = 'message success';
                    })
                    .catch(function(err) {
                        msgEl.textContent = err.message;
                        msgEl.className = 'message error';
                    });
            });

            card.querySelector('.delete-btn').addEventListener('click', function() {
                if (!confirm('Diesen Fall wirklich löschen?')) return;
                fetch('/api/case?id=' + encodeURIComponent(id), {
                    method: 'DELETE',
                    headers: AssistoAuth.headers()
                })
                    .then(function(resp) { return resp.json().then(function(b) { return { ok: resp.ok, body: b }; }); })
                    .then(function(r) {
                        if (!r.ok || !r.body.success) throw new Error(r.body.message || 'Löschen fehlgeschlagen');
                        card.remove();
                    })
                    .catch(function(err) { alert(err.message); });
            });
        });
    }

    document.getElementById('pw-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var password = document.getElementById('new-password').value;
        var confirm = document.getElementById('new-password-confirm').value;
        var msg = document.getElementById('pw-message');
        var btn = document.getElementById('pw-submit');

        msg.textContent = '';
        msg.className = 'message';

        if (password.length < 8) {
            msg.textContent = 'Mindestens 8 Zeichen.';
            msg.className = 'message error';
            return;
        }
        if (password !== confirm) {
            msg.textContent = 'Passwörter stimmen nicht überein.';
            msg.className = 'message error';
            return;
        }

        btn.disabled = true;

        fetch('/api/users', {
            method: 'PATCH',
            headers: AssistoAuth.headers({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ username: auth.username, password: password })
        })
            .then(function(resp) {
                if (resp.status === 401) {
                    AssistoAuth.clear();
                    throw new Error('Sitzung abgelaufen — bitte erneut anmelden.');
                }
                return resp.json().then(function(b) { return { ok: resp.ok, body: b }; });
            })
            .then(function(r) {
                if (!r.ok || !r.body.success) throw new Error(r.body.message || 'Ändern fehlgeschlagen');
                msg.textContent = 'Passwort geändert.';
                msg.className = 'message success';
                document.getElementById('new-password').value = '';
                document.getElementById('new-password-confirm').value = '';
            })
            .catch(function(err) {
                msg.textContent = err.message;
                msg.className = 'message error';
            })
            .then(function() { btn.disabled = false; });
    });
    </script>
</body>
</html>
