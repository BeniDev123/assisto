<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assisto – Case Help</title>
    <link rel="stylesheet" href="/assets/app.css">
    <style>
        .page {
            max-width: 480px;
        }

        /* One continuous card for the whole flow (fault -> what's known ->
           share a fix) instead of separately bordered/colored boxes that
           read as unrelated - it's all one flow, so it should look like it.
           Color now lives as a left accent stripe per section rather than
           a full box outline. */
        .page-flow {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .context-card {
            background: var(--panel);
            border-left: 4px solid var(--danger);
            padding: 12px 14px;
        }

        .results-block {
            background: var(--panel);
            border-top: 1px solid var(--line);
            border-left: 4px solid var(--success);
            padding: 14px;
        }

        .share-block {
            background: var(--panel);
            border-top: 1px solid var(--line);
            border-left: 4px solid var(--accent);
            padding: 14px;
        }

        .context-label {
            font-size: 11px;
            color: var(--soft);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .context-ids {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .context-id {
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            background: var(--field);
            color: var(--muted);
            padding: 3px 8px;
            border-radius: 10px;
        }

        .context-type {
            font-size: 12px;
            color: var(--soft);
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            margin: 18px 0 10px 0;
        }

            .section-heading:first-child {
                margin-top: 0;
            }

        .section-heading.good { color: var(--success); }
        .section-heading.other { color: var(--warning); }
        .section-heading.partial { color: var(--info); }

        .case-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

            .case-card.good { border-color: var(--success); }
            .case-card.partial { border-color: var(--info); }

        .case-meta {
            font-size: 11px;
            color: var(--soft);
            margin-bottom: 6px;
        }

        .case-line {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .case-label {
            color: var(--soft);
        }

        .verified-icon {
            display: inline-flex;
            vertical-align: -2px;
            color: var(--success);
        }

            .verified-icon svg { width: 15px; height: 15px; display: block; }

        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--field);
            color: var(--text);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

            .like-btn:hover { border-color: var(--accent); }
            .like-btn:disabled { opacity: 0.6; cursor: not-allowed; }

            .like-btn.liked {
                background: rgba(231, 106, 29, 0.15);
                border-color: var(--accent);
                color: var(--accent);
            }

            .like-btn .like-icon { display: inline-flex; }
            .like-btn .like-icon svg { width: 14px; height: 14px; display: block; }

        .other-type-note {
            font-size: 12px;
            color: var(--soft);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }

        form h2 {
            font-size: 15px;
            margin: 0 0 12px 0;
        }

        form button.primary {
            width: 100%;
        }

        .form-message {
            text-align: center;
        }

        .offline-note {
            font-size: 11px;
            color: var(--soft);
            text-align: center;
            margin-top: 24px;
        }

        .login-prompt {
            text-align: center;
        }

            .login-prompt p {
                font-size: 13px;
                color: var(--muted);
                margin: 0 0 12px 0;
            }

            .login-prompt a.button {
                display: inline-block;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                background: var(--accent);
                color: #fff;
                text-decoration: none;
            }

                .login-prompt a.button:hover {
                    background: var(--accent-hover);
                }
    </style>
</head>
<body>

    <div class="app-shell">

        <div class="mobile-topbar">
            <button type="button" class="hamburger-btn" id="hamburger-btn">☰</button>
            <span class="topbar-brand">Assisto</span>
        </div>

        <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">Assisto</div>
            <div class="sidebar-identity" id="app-identity"></div>
            <nav class="sidebar-nav" id="app-nav"></nav>
        </div>

        <div class="app-main">
        <div class="page">

        <div class="page-flow">

            <div class="context-card">
                <div class="context-label">This fault combination</div>
                <div class="context-ids" id="context-ids"></div>
                <div class="context-type" id="context-type"></div>
            </div>

            <div class="results-block">
                <div id="results">
                    <div class="loading">Looking up known cases…</div>
                </div>
            </div>

            <div class="share-block">
                <form id="submit-form" hidden>
                    <h2>Know the fix? Share it.</h2>
                    <label>Cause</label>
                    <textarea id="form-cause" rows="2" placeholder="e.g. cabinet fan clogged"></textarea>
                    <label>Remedy</label>
                    <textarea id="form-remedy" rows="2" placeholder="e.g. cleaned fan, replaced filter"></textarea>
                    <button type="submit" class="primary" id="form-submit">Submit</button>
                    <div class="message form-message" id="form-message"></div>
                </form>

                <div class="login-prompt" id="login-prompt" hidden>
                    <p>Kennst du die Lösung? Melde dich an, um sie zu teilen.</p>
                    <a class="button" id="login-link" href="/login.html">Anmelden</a>
                </div>
            </div>

        </div>

        <div class="offline-note">This page needs a connection on your phone &mdash; the machine itself works fully offline.</div>

        </div>
        </div>
    </div>

    <script src="/assets/auth-client.js"></script>
    <script src="/assets/sidebar.js"></script>
    <script>
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    var HEART_PATH = 'M12 20s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 5c-2.5 4.6-9.5 9-9.5 9z';
    var HEART_OUTLINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + HEART_PATH + '"/></svg>';

    // Scalloped "verified" seal (the familiar checkmark-badge shape), not a
    // bare checkmark - reads as an actual trust badge even at a small size.
    var VERIFIED_BADGE_SVG =
        '<svg viewBox="0 0 24 24">' +
        '<path fill="currentColor" d="M12 1.5l2.4 1.7 2.9-.4 1.1 2.7 2.7 1.1-.4 2.9 1.7 2.4-1.7 2.4.4 2.9-2.7 1.1-1.1 2.7-2.9-.4L12 22.5l-2.4-1.7-2.9.4-1.1-2.7-2.7-1.1.4-2.9L1.6 12l1.7-2.4-.4-2.9 2.7-1.1 1.1-2.7 2.9.4z"/>' +
        '<path fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.3l2.7 2.7 5.7-6.2"/>' +
        '</svg>';
    var HEART_FILLED = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="' + HEART_PATH + '"/></svg>';

    var params = new URLSearchParams(window.location.search);
    var fp = params.get('fp') || '';
    var machineType = params.get('type') || '';
    var ids = fp.split('|').filter(Boolean);
    // Optional - the QR code drops this for very large packets to stay
    // scannable, so it may be shorter than `ids` or missing entirely.
    var messages = (params.get('msg') || '').split('|').filter(Boolean);

    document.getElementById('context-ids').innerHTML = ids.length
        ? ids.map(function(id, i) {
            var msg = messages[i];
            return '<span class="context-id">' + escapeHtml(id) + (msg ? ' &mdash; ' + escapeHtml(msg) : '') + '</span>';
        }).join('')
        : '<span class="context-id">no Id in link</span>';
    document.getElementById('context-type').textContent = machineType ? 'Machine type: ' + machineType : 'Machine type: unknown';

    function currentUrl() {
        return window.location.pathname + window.location.search;
    }

    function refreshAuthUi() {
        var auth = AssistoAuth.get();
        var form = document.getElementById('submit-form');
        var loginPrompt = document.getElementById('login-prompt');

        if (auth && auth.token) {
            form.hidden = false;
            loginPrompt.hidden = true;
        } else {
            form.hidden = true;
            loginPrompt.hidden = false;
            document.getElementById('login-link').href = '/login.html?redirect=' + encodeURIComponent(currentUrl());
        }
        return auth;
    }

    refreshAuthUi();

    function buildCaseCardHtml(c, cls) {
        var storedMessages = Array.isArray(c.messages) ? c.messages.filter(Boolean) : [];
        var likedBy = Array.isArray(c.likedBy) ? c.likedBy : [];
        var auth = AssistoAuth.get();
        var likedByMe = !!(auth && likedBy.indexOf(auth.username) !== -1);
        return '<div class="case-card ' + cls + '" data-id="' + escapeHtml(c.id) + '">' +
            '<div class="case-meta">' + escapeHtml(new Date(c.timestamp).toLocaleString()) +
                (c.technician ? ' &middot; ' + escapeHtml(c.technician) : '') +
                (c.machineType ? ' &middot; ' + escapeHtml(c.machineType) : '') +
                (c.verified
                    ? ' <span class="verified-icon" title="Von Admin geprüft">' + VERIFIED_BADGE_SVG + '</span>'
                    : '') +
            '</div>' +
            (storedMessages.length
                ? '<div class="case-line" style="margin-bottom:6px;">' + storedMessages.map(escapeHtml).join(' &middot; ') + '</div>'
                : '') +
            '<div class="case-line"><span class="case-label">Cause:</span> ' + escapeHtml(c.cause) + '</div>' +
            '<div class="case-line"><span class="case-label">Remedy:</span> ' + escapeHtml(c.remedy) + '</div>' +
            '<button type="button" class="like-btn' + (likedByMe ? ' liked' : '') + '" data-id="' + escapeHtml(c.id) + '">' +
                '<span class="like-icon">' + (likedByMe ? HEART_FILLED : HEART_OUTLINE) + '</span> ' +
                '<span class="like-count">' + likedBy.length + '</span>' +
                '<span class="like-word">' + (likedBy.length === 1 ? ' hat geholfen' : ' fanden das hilfreich') + '</span>' +
            '</button>' +
        '</div>';
    }

    function renderResults(data) {
        var el = document.getElementById('results');
        var html = '';

        var total = data.exactSameType.length + data.exactOtherType.length +
            data.partialSameType.length + data.partialOtherType.length;

        if (total === 0) {
            html = '<div class="empty-state">No known cases for this combination yet &mdash; be the first to share one below.</div>';
        } else {
            if (data.exactSameType.length > 0) {
                html += '<div class="section-heading good">&#10003; Known on this machine type</div>';
                html += data.exactSameType.map(function(c) { return buildCaseCardHtml(c, 'good'); }).join('');
            }
            if (data.exactOtherType.length > 0) {
                html += '<div class="section-heading other">&#9432; Seen on other machine types &ndash; cause may not apply here</div>';
                html += data.exactOtherType.map(function(c) { return buildCaseCardHtml(c, ''); }).join('');
            }
            if (data.partialSameType.length > 0) {
                html += '<div class="section-heading partial">&#9680; Partial match &ndash; covers part of this combination</div>';
                html += data.partialSameType.map(function(c) { return buildCaseCardHtml(c, 'partial'); }).join('');
            }
            if (data.partialOtherType.length > 0) {
                html += '<div class="other-type-note">' + data.partialOtherType.length + ' partial match(es) on other machine types.</div>';
            }
        }

        el.innerHTML = html;
        wireLikeButtons();
    }

    function wireLikeButtons() {
        document.querySelectorAll('.like-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var auth = AssistoAuth.get();
                if (!auth || !auth.token) {
                    refreshAuthUi();
                    return;
                }
                var id = btn.getAttribute('data-id');
                btn.disabled = true;
                fetch('/api/case', {
                    method: 'PATCH',
                    headers: AssistoAuth.headers({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ id: id })
                })
                    .then(function(resp) {
                        if (resp.status === 401) {
                            AssistoAuth.clear();
                            refreshAuthUi();
                            throw new Error('Session abgelaufen');
                        }
                        return resp.json();
                    })
                    .then(function(body) {
                        if (!body.success) throw new Error(body.message || 'Fehlgeschlagen');
                        btn.classList.toggle('liked', body.liked);
                        btn.querySelector('.like-icon').innerHTML = body.liked ? HEART_FILLED : HEART_OUTLINE;
                        btn.querySelector('.like-count').textContent = body.likes;
                        btn.querySelector('.like-word').textContent = body.likes === 1 ? ' hat geholfen' : ' fanden das hilfreich';
                    })
                    .catch(function(err) { alert(err.message); })
                    .then(function() { btn.disabled = false; });
            });
        });
    }

    fetch('/api/case?fp=' + encodeURIComponent(fp) + '&type=' + encodeURIComponent(machineType))
        .then(function(resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
        })
        .then(renderResults)
        .catch(function(err) {
            document.getElementById('results').innerHTML =
                '<div class="empty-state">Could not load known cases: ' + escapeHtml(err.message) + '</div>';
        });

    document.getElementById('submit-form').addEventListener('submit', function(e) {
        e.preventDefault();

        var cause = document.getElementById('form-cause').value.trim();
        var remedy = document.getElementById('form-remedy').value.trim();
        var messageEl = document.getElementById('form-message');
        var submitBtn = document.getElementById('form-submit');
        var auth = AssistoAuth.get();

        if (!auth || !auth.token) {
            refreshAuthUi();
            return;
        }

        if (!cause || !remedy) {
            messageEl.textContent = 'Please fill in cause and remedy.';
            messageEl.className = 'message form-message error';
            return;
        }

        submitBtn.disabled = true;
        messageEl.textContent = '';
        messageEl.className = 'message form-message';

        fetch('/api/case', {
            method: 'POST',
            headers: AssistoAuth.headers({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
                fingerprint: fp,
                machineType: machineType,
                messages: messages,
                cause: cause,
                remedy: remedy
            })
        })
            .then(function(resp) {
                if (resp.status === 401) {
                    AssistoAuth.clear();
                    refreshAuthUi();
                    throw new Error('Session abgelaufen — bitte erneut anmelden.');
                }
                if (!resp.ok) return resp.json().then(function(body) { throw new Error(body.message || ('HTTP ' + resp.status)); });
                return resp.json();
            })
            .then(function() {
                messageEl.textContent = 'Thanks — shared with everyone who scans this fault.';
                messageEl.className = 'message form-message success';
                document.getElementById('form-cause').value = '';
                document.getElementById('form-remedy').value = '';
                return fetch('/api/case?fp=' + encodeURIComponent(fp) + '&type=' + encodeURIComponent(machineType));
            })
            .then(function(resp) { return resp.json(); })
            .then(renderResults)
            .catch(function(err) {
                messageEl.textContent = 'Save failed: ' + err.message;
                messageEl.className = 'message form-message error';
            })
            .then(function() {
                submitBtn.disabled = false;
            });
    });
    </script>
</body>
</html>
