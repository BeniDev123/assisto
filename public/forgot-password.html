<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assisto – Passwort vergessen</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="theme-color" content="#060606">
    <link rel="stylesheet" href="/assets/app.css">
    <style>
        .center-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 340px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 20px;
        }

        .card h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            text-align: center;
        }

        .card p.sub {
            color: var(--soft);
            font-size: 13px;
            text-align: center;
            margin: 0 0 18px 0;
        }

        .card button.primary {
            width: 100%;
        }

        .message {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="center-page">
        <div class="card">
            <h1>Passwort vergessen</h1>
            <p class="sub">Ein Admin setzt dir ein neues Passwort und gibt es dir persönlich weiter.</p>

            <form id="request-form">
                <label>Benutzername</label>
                <input type="text" id="username" autocomplete="username" autocapitalize="off" />
                <button type="submit" class="primary" id="submit-btn">Anfrage senden</button>
                <div class="message" id="message"></div>
            </form>

            <p class="sub" style="margin-top:14px; margin-bottom:0;">
                <a href="/login.html">Zurück zum Login</a>
            </p>
        </div>
    </div>

    <script src="/assets/pwa.js"></script>
    <script>
    document.getElementById('request-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var messageEl = document.getElementById('message');
        var btn = document.getElementById('submit-btn');
        var form = document.getElementById('request-form');

        if (!username) {
            messageEl.textContent = 'Bitte Benutzername eingeben.';
            messageEl.className = 'message error';
            return;
        }

        btn.disabled = true;
        messageEl.textContent = '';

        fetch('/api/password-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username })
        })
            .then(function(resp) { return resp.json(); })
            .then(function() {
                // Always the same message, whether or not that username
                // exists - otherwise this becomes a way to check which
                // usernames are valid accounts.
                form.hidden = true;
                messageEl.className = 'message success';
                messageEl.textContent = 'Falls dieser Benutzername existiert, wurde ein Admin benachrichtigt. Er meldet sich mit einem neuen Passwort bei dir.';
            })
            .catch(function() {
                messageEl.textContent = 'Anfrage fehlgeschlagen, bitte später erneut versuchen.';
                messageEl.className = 'message error';
                btn.disabled = false;
            });
    });
    </script>
</body>
</html>
