<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assisto – Login</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="theme-color" content="#060606">
    <link rel="stylesheet" href="/assets/app.css">
    <style>
        .center-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 340px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 20px;
        }

        .card h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            text-align: center;
        }

        .card p.sub {
            color: var(--soft);
            font-size: 13px;
            text-align: center;
            margin: 0 0 18px 0;
        }

        .card button.primary {
            width: 100%;
        }

        .message {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="center-page">
        <div class="card">
            <h1>Assisto</h1>
            <p class="sub">Anmelden, um eine Lösung zu teilen</p>
            <form id="login-form">
                <label>Benutzername</label>
                <input type="text" id="username" autocomplete="username" autocapitalize="off" />
                <label>Passwort</label>
                <input type="password" id="password" autocomplete="current-password" />
                <button type="submit" class="primary" id="submit-btn">Anmelden</button>
                <div class="message error" id="message"></div>
            </form>
        </div>
    </div>

    <script src="/assets/auth-client.js"></script>
    <script src="/assets/pwa.js"></script>
    <script>
    var params = new URLSearchParams(window.location.search);
    var redirect = params.get('redirect') || '/';

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var messageEl = document.getElementById('message');
        var btn = document.getElementById('submit-btn');

        if (!username || !password) {
            messageEl.textContent = 'Bitte Benutzername und Passwort eingeben.';
            return;
        }

        btn.disabled = true;
        messageEl.textContent = '';

        fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
            .then(function(resp) { return resp.json().then(function(body) { return { ok: resp.ok, body: body }; }); })
            .then(function(result) {
                if (!result.ok || !result.body.success) {
                    throw new Error(result.body.message || 'Anmeldung fehlgeschlagen');
                }
                AssistoAuth.set({
                    token: result.body.token,
                    username: result.body.username,
                    role: result.body.role
                });
                window.location.href = redirect;
            })
            .catch(function(err) {
                messageEl.textContent = err.message;
                btn.disabled = false;
            });
    });
    </script>
</body>
</html>
